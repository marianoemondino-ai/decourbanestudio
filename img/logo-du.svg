<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 90" role="img" aria-label="Decourban Estudio">
  <!-- Orange circle -->
  <circle cx="45" cy="45" r="42" fill="#F89A36"/>
  <!-- dU inside circle -->
  <text x="45" y="55" font-family="'Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="700" fill="white" text-anchor="middle" letter-spacing="-1">dU</text>
  <!-- Accent dash above text block -->
  <rect x="100" y="12" width="20" height="3" fill="#F89A36" rx="1.5"/>
  <!-- deco -->
  <text x="100" y="38" font-family="'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="white" letter-spacing="-0.4">deco</text>
  <!-- urban -->
  <text x="100" y="62" font-family="'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="white" letter-spacing="-0.4">urban</text>
  <!-- interiorismo -->
  <text x="100" y="75" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="rgba(255,255,255,0.80)" letter-spacing="0.2">interiorismo</text>
  <!-- estudio -->
  <text x="100" y="88" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="rgba(255,255,255,0.80)" letter-spacing="0.2">estudio</text>
</svg>
